<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitalGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Outer energy field -->
  <circle cx="16" cy="16" r="11" stroke="url(#glowGradient)" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.5" />
  
  <!-- Back ring -->
  <path d="M 2 16 A 14 4 0 0 1 30 16" transform="rotate(-20 16 16)" stroke="url(#glowGradient)" stroke-width="1.5" />
  
  <!-- Central Void -->
  <circle cx="16" cy="16" r="7.5" fill="#000000" stroke="url(#orbitalGradient)" stroke-width="1.5" />
  
  <!-- Front ring -->
  <path d="M 30 16 A 14 4 0 0 1 2 16" transform="rotate(-20 16 16)" stroke="url(#orbitalGradient)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central glow core -->
  <circle cx="16" cy="16" r="6.5" stroke="#0ea5e9" stroke-width="0.5" opacity="0.4" />
</svg>
